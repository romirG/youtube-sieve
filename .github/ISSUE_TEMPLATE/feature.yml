name: Feature or task
description: Propose new functionality, documentation or other planned work.
labels: ["type: feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that defines "done" and can be verified by anyone.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Related requirements
      description: SRS requirement IDs, if any (e.g. FR-1, TQ-6).
